; vscode-border configuration
; Lines starting with ; or # are comments.
; After editing, use the tray icon menu > "Reload Config" (no restart needed)
; -- except for "colors", which only takes effect on the next app launch.

; Border thickness in pixels, drawn just outside each VS Code window.
thickness=4

; Border opacity: 0 (invisible) - 255 (fully opaque).
opacity=255

; Safety-net rescan interval in milliseconds. New/closed windows are
; normally detected instantly via Windows events; this just catches
; anything a missed event would leave stale.
rescan_interval_ms=1500

; Comma-separated hex colors (RRGGBB) assigned round-robin to windows.
colors=E64A4A,4A9CE6,4AE67A,E6B84A,B04AE6,4AE6DC,E64AA8,9CE64A,E67A4A,4A5CE6

; Show the open folder/workspace name as a label chip just inside the
; top-left corner of the border (true/false). When true, this app also
; auto-configures VS Code's global "window.title" setting so the label can
; show "repo - branch" instead of just the folder name -- no manual
; settings.json editing needed. The original value (or its absence) is
; remembered and restored automatically when this is set back to false.
; See README.md for details.
show_label=true

; Show an interactive project list HUD -- a single strip using the same
; labels/colors as the per-window border chips (see project_list_order below
; for how items are ordered). It sits in a band label_height pixels tall that
; it reserves directly above the taskbar on the primary monitor, so maximized
; windows stop above it. Ctrl+left-click-drag either edge to resize it, or
; the middle to slide it sideways within the band; a plain right-click opens
; a context menu (e.g. to set an alias for an item's label).
show_project_list=true

; Paint the whole reserved band to look like the taskbar
; (true), so it reads as part of the taskbar, or leave the band's empty
; part showing the desktop (false). Copied from what the taskbar actually
; shows on screen, so it follows dark/light mode, accent color, transparency
; and taskbar restyling tools automatically. A translucent taskbar is
; matched as a snapshot (refreshed every 30s and on theme/wallpaper
; changes), not a live blur. The taskbar's top border line is copied too, as
; a 1px border along the top of the band (which makes the band 1px taller).
project_list_fixed_match_taskbar=true

; Project list item order: "auto" (sorted by each VS Code window's left
; edge, so it acts as a stable visual index matching your desktop layout)
; or "manual" (drag items with a plain left-click to arrange them yourself;
; new windows are appended at the end until you place them). The manual
; order is remembered across restarts.
project_list_order=auto

; Project list HUD opacity when no item is hovered: 0 (invisible) - 255 (fully opaque).
project_list_opacity_normal=160

; Project list HUD opacity for the currently hovered item: 0 (invisible) - 255 (fully opaque).
project_list_opacity_hover=255

; Temporarily activate a VS Code window when hovering its project-list item.
; When false, hovering only highlights the item; clicking still activates it.
project_list_activate_on_hover=false

; Label chip height in pixels, and font size in points.
label_height=22
label_font_size=13

; Label text color: either a hex color (RRGGBB) or "auto" to pick black/white
; based on contrast against the border color.
label_text_color=000000

; Border label text for a window that has an alias (set via the project list
; HUD's right-click > Set Alias). Tokens: <Alias> and <Branch> (current git
; branch). Outside a git repo there's no branch, so a format using <Branch>
; shows just the alias. Windows without an alias keep showing "repo - branch".
; The project list HUD itself always shows just the alias.
; Examples: <Alias> - <Branch>   |   <Alias>   |   <Alias> [<Branch>]
label_alias_format=<Alias> - <Branch>

; Extra arguments for Linux VS Code in a WSL distro, added right after `code`
; whenever this app opens a folder there (favourites, new window). One key per
; distro: wsl_vscode_extra_args.<distro>=<args>, space-separated (no quoting).
; None by default. Example -- WebGL on the CPU (SwiftShader) where the GPU
; path is unusable:
; wsl_vscode_extra_args.Ubuntu=--use-angle=swiftshader --enable-unsafe-swiftshader

; User profiles -- up to 5. Profile 1 is the Windows account this app runs
; as, so its _account is a fixed placeholder; profiles 2-5 are other
; Windows accounts to start VS Code as, unused while their _account is
; empty. With any of those in use, the project list "+" button menu's
; Start VS Code asks which account to open the new window as. Starting a
; program as another account takes its password: it's asked for the
; first time, and can be saved in Windows Credential Manager. Every VS
; Code window running as another account -- a profile's or not -- shows
; that account's icon in front of its label; this account's windows show
; one only when profile 1 has an _icon.
; A profile's windows get the AI status indicator too (see
; ai_indicator_enabled below), which needs that saved password.
; Each account's VS Code is found by itself: the one its windows last ran
; (remembered in vscode_installs.ini), else a search as that account (its
; PATH, its per-user install, a machine-wide one), else another account's
; install that's outside every profile folder (e.g. a portable one).
;   _account  the Windows account name, as is (spaces and any letters are fine)
;   _icon     the account's icon: an image file (.png, .ico, ...), absolute
;             or relative to this file -- or the image itself as base64
;             (bare, or a data:image/png;base64,... URI). Empty: a round
;             badge with the account's first letter (none for profile 1).
;   _color    background of the account's Claude usage rings, hex RRGGBB
;             (see usage_meter_enabled below). Empty: none (transparent).
;             Pick a dark one: the rings are green, amber and red.
;   _ring_badge  whether the account's icon shows in front of its usage
;             rings (true/false). Empty: true. Its windows keep theirs.

; Profile 1 -- this account. Leave its _account as it is.
user_profile_1_account=<the account running VS Code Border - do not edit>
user_profile_1_icon=
user_profile_1_color=
user_profile_1_ring_badge=

user_profile_2_account=
user_profile_2_icon=
user_profile_2_color=
user_profile_2_ring_badge=

user_profile_3_account=
user_profile_3_icon=
user_profile_3_color=
user_profile_3_ring_badge=

user_profile_4_account=
user_profile_4_icon=
user_profile_4_color=
user_profile_4_ring_badge=

user_profile_5_account=
user_profile_5_icon=
user_profile_5_color=
user_profile_5_ring_badge=

; Log every WinEvent + overlay sync decision (HIDE/REPAINT) for tracked
; windows -- noisy, only useful when diagnosing a tracking/repaint bug.
verbose_logging=false

; Small status indicator on each project list HUD item, showing whether an
; AI coding assistant is running in that VS Code window's terminal(s). See
; README.md's "Claude Code status dots" section for what this needs set up
; on the AI tool's side (this app manages that automatically once enabled).
ai_indicator_enabled=true

; Comma-separated list of AI services to source the indicator from.
; "claude" is the only one implemented today; "copilot" is accepted for a
; planned future integration but currently does nothing.
ai_indicator_provider=claude

; Indicator colors (hex RRGGBB) for each of the 3 states.
ai_indicator_color_working=FF9F0A
ai_indicator_color_attention=DC2626
ai_indicator_color_waiting=34C759

; Indicator border color: "auto" (default) picks black or white for best
; contrast against that item's own color; or set a fixed hex RRGGBB.
ai_indicator_border_color=auto

; Claude usage rings at the right end of the project list HUD's band: one
; pair per account -- user profile 1 (this one), then each other profile's,
; on that profile's _color (if any), with its icon in front -- outer ring
; weekly, inner ring session (5-hour). Green, amber from 70%, red from 90%;
; a pulsing amber "!" instead whenever the usage is unavailable, whatever
; the reason (login expired, network, ...). Hover for the exact numbers,
; reset times, or why it's unavailable. Read with each account's own
; Claude Code login; another
; account needs its password saved in Credential Manager. Failures are
; logged as warnings. See README.md's "Claude usage rings" section.
usage_meter_enabled=true

; How often to re-read usage, in minutes (1-60).
usage_meter_refresh_minutes=5
