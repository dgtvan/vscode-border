; vscode-border configuration
; Lines starting with ; or # are comments.
; After editing, use the tray icon menu > "Reload Config" (no restart needed)
; -- except for "colors", which only takes effect on the next app launch.

; Border thickness in pixels, drawn just outside each VS Code window.
thickness=4

; Border opacity: 0 (invisible) - 255 (fully opaque).
opacity=255

; Safety-net rescan interval in milliseconds. New/closed windows are
; normally detected instantly via Windows events; this just catches
; anything a missed event would leave stale.
rescan_interval_ms=1500

; Comma-separated hex colors (RRGGBB) assigned round-robin to windows.
colors=E64A4A,4A9CE6,4AE67A,E6B84A,B04AE6,4AE6DC,E64AA8,9CE64A,E67A4A,4A5CE6

; Show the open folder/workspace name as a label chip just inside the
; top-left corner of the border (true/false). When true, this app also
; auto-configures VS Code's global "window.title" setting so the label can
; show "repo - branch" instead of just the folder name -- no manual
; settings.json editing needed. The original value (or its absence) is
; remembered and restored automatically when this is set back to false.
; See README.md for details.
show_label=true

; Show an interactive project list HUD -- a single strip using the same
; labels/colors as the per-window border chips; drag an item with a plain
; left-click to reorder it (the order isn't saved). It sits in a band
; label_height pixels tall that it reserves directly above the taskbar on
; the primary monitor, so maximized windows stop above it.
; Ctrl+left-click-drag either edge to resize it, or
; the middle to slide it sideways within the band; a plain right-click opens
; a context menu (e.g. to set an alias for an item's label).
show_project_list=true

; Paint the whole reserved band to look like the taskbar
; (true), so it reads as part of the taskbar, or leave the band's empty
; part showing the desktop (false). Copied from what the taskbar actually
; shows on screen, so it follows dark/light mode, accent color, transparency
; and taskbar restyling tools automatically. A translucent taskbar is
; matched as a snapshot (refreshed every 30s and on theme/wallpaper
; changes), not a live blur. The taskbar's top border line is copied too, as
; a 1px border along the top of the band (which makes the band 1px taller).
project_list_fixed_match_taskbar=true

; Project list HUD opacity when no item is hovered: 0 (invisible) - 255 (fully opaque).
project_list_opacity_normal=160

; Project list HUD opacity for the currently hovered item: 0 (invisible) - 255 (fully opaque).
project_list_opacity_hover=255

; Temporarily activate a VS Code window when hovering its project-list item.
; When false, hovering only highlights the item; clicking still activates it.
project_list_activate_on_hover=false

; Label chip height in pixels, and font size in points.
label_height=22
label_font_size=13

; Label text color: either a hex color (RRGGBB) or "auto" to pick black/white
; based on contrast against the border color.
label_text_color=000000

; Border label text for a window that has an alias (set via the project list
; HUD's right-click > Set Alias). Tokens: <Alias> and <Branch> (current git
; branch). Outside a git repo there's no branch, so a format using <Branch>
; shows just the alias. Windows without an alias keep showing "repo - branch".
; The project list HUD itself always shows just the alias.
; Examples: <Alias> - <Branch>   |   <Alias>   |   <Alias> [<Branch>]
label_alias_format=<Alias> - <Branch>

; Assistant account profiles -- ten slots, shared by Claude and Codex.
; _type: Claude, Codex or None (case-insensitive). Empty type OR empty path
; means no assistant; an empty path never selects a default account.
; _profile_path: explicit absolute account folder, with %ENV% expansion.
; _name: optional; otherwise account email, then folder name.
; _icon: image path (relative to this file or absolute), or base64 image.
; Standard provider folders have no fallback icon; other folders use a
; letter badge when no image is configured.
; _color: optional RRGGBB background for this account's usage rings.
; _ring_badge: show the profile icon beside its rings (empty means true).
; _usage_enabled: monitor this profile's usage (empty means true).
; _vscode_profile: the name of a VS Code profile (the ones in VS Code's
; "Profiles" menu) to open this account's windows with. Empty means the
; profile VS Code would pick itself. This is what keeps one assistant per
; window: a VS Code profile has its own enabled extensions and its own
; settings (so its own terminal.integrated.env.windows), it survives a
; window reload, and VS Code gives it to windows it opens by itself -- none
; of which is true of the extension disabling below. It is also how a window
; VS Code opened itself is recognized. Create the profile in VS Code first;
; a name VS Code doesn't have is ignored with a warning, since opening with
; it would create an empty profile.
; Menus show configured accounts in slot order, using their names as given.
; Launching Claude disables the Codex extension in that window; launching
; Codex disables Claude. None disables both. Terminal CLIs remain available.
; Old claude_profile_* / codex_profile_* configurations migrate automatically
; with an exact backup and explicit paths preserving their account folders.

profile_1_type=Claude
profile_1_name=
profile_1_profile_path=%USERPROFILE%\.claude
profile_1_icon=
profile_1_color=
profile_1_ring_badge=
profile_1_usage_enabled=
profile_1_vscode_profile=

