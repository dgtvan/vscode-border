; Log every WinEvent + overlay sync decision (HIDE/REPAINT) for tracked
; windows -- noisy, only useful when diagnosing a tracking/repaint bug.
verbose_logging=false

; Small status indicator on each project list HUD item, showing whether an
; AI coding assistant is running in that VS Code window. See README.md's
; "AI status indicator" section for what this needs set up on the AI tool's
; side (Claude Code needs hooks, which this app manages automatically once
; enabled; Codex needs nothing at all).
ai_indicator_enabled=true

; Comma-separated list of AI services to source the indicator from.
; "claude" and "codex" are implemented; "copilot" is accepted for a planned
; future integration but currently does nothing. A window only ever shows
; its own assistant's status, so listing both is safe.
ai_indicator_provider=claude,codex

; Indicator colors (hex RRGGBB) for each of the 3 states.
ai_indicator_color_working=FF9F0A
ai_indicator_color_attention=DC2626
ai_indicator_color_waiting=34C759

; Indicator border color: "auto" (default) picks black or white for best
; contrast against that item's own color; or set a fixed hex RRGGBB.
ai_indicator_border_color=auto

; Which terminal an AI CLI launch opens in -- the hub's "Start AI CLI" and
; "Open in AI CLI" menus (see README.md's "AI CLI launches" section).
;   auto             prefer Windows Terminal, fall back to a console window
;   windows-terminal Windows Terminal, falling back if it isn't installed
;   cmd              always a plain console window
; Only the terminal is chosen here; which CLI runs, and as which account,
; comes from the profile slots above.
ai_cli_terminal=auto

; Usage rings for configured Claude and Codex accounts, in profile slot
; order. Each profile can hide its rings with _usage_enabled=false.
; Inner ring: session/primary; outer: weekly/secondary. Hover shows exact
; percentages, durations, reset times, and any unavailable state.
usage_meter_enabled=true

; How often to re-read usage, in minutes (1-60).
usage_meter_refresh_minutes=5
